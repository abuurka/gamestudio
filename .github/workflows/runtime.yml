# SPDX-License-Identifier: MIT
#
# GameStudio runtime (engine, dev server, MCP server) and examples: typecheck and unit tests on the
# Node.js versions game projects run on: the oldest supported (package.json "engines") and the
# portable LTS the extension installs when there is none (blender/gamestudio/core/node.lock.json;
# bump it here with the lock). Nothing here touches Blender, so it is quick and safe for pull
# requests: GitHub-hosted runners are throwaway VMs, the token is read-only and no secrets are used.
#
# Both versions run on Ubuntu; macOS (Apple Silicon) runs the portable LTS and is experimental
# (continue-on-error) until it has passed. Node 22 on Ubuntu, Windows and macOS, the Blender
# suites (on Blender 5.2.2 and 5.3.0), smoke and features run in extension.yml.

name: runtime

on:
  push:
    paths:
      - "runtime/**"
      - "examples/**"
      - "blender/tests/templates.tsconfig.json"
      - "blender/gamestudio/project_templates/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/runtime.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "examples/**"
      - "blender/tests/templates.tsconfig.json"
      - "blender/gamestudio/project_templates/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and unit tests (${{ matrix.name }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            node: "22.12.0"
            browser: /usr/bin/google-chrome
          - name: Linux
            os: ubuntu-latest
            node: "24.21.0"
            browser: /usr/bin/google-chrome
          - name: macOS (experimental)
            os: macos-latest
            node: "24.21.0"
            browser: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: npm ci
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # runtime/packages/host (the shelved fork's Electron host) is never started

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm test (vitest)
        env:
          GS_BROWSER: ${{ matrix.browser }} # the real-browser tests use Chrome, not the first browser that may not start
        run: npm test
